# The two functions from the registry, and this repository's function, built
# from your working tree. run.sh fills in FN_PACKAGE and FN_IMAGE.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.2
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.1
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-lifecycle
spec:
  package: FN_PACKAGE
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: function-lifecycle-e2e
---
# Crossplane pulls the package from the local registry. The function's
# container runs the image run.sh loaded into kind, so kind needs no registry
# configuration.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: function-lifecycle-e2e
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
          - name: package-runtime
            image: FN_IMAGE
            imagePullPolicy: IfNotPresent
