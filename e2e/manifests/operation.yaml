apiVersion: ops.crossplane.io/v1alpha1
kind: Operation
metadata:
  name: freeze-apps
spec:
  mode: Pipeline
  pipeline:
  - step: freeze
    functionRef:
      name: function-lifecycle
    input:
      apiVersion: lifecycle.fn.crossplane.io/v1beta1
      kind: Input
      mode: ObserveOnly
    requirements:
      requiredResources:
      - requirementName: apps
        apiVersion: example.crossplane.io/v1
        kind: App
        matchLabels:
          freeze: "true"
